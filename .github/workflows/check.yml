name: stock-check

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (실제로는 몇 분 늦을 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # state.json 커밋용

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 재고 조회
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_HEADERS: ${{ secrets.API_HEADERS }}

      - name: 상태 저장
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
